<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <base href="/">
  <title>Reset password | Sahoo ExamNexa</title>
  <link rel="icon" type="image/png" href="sahoo-examnexa-icon-32.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="password-recovery.js"></script>
</head>
<body class="recovery-page">
  <main class="main">
    <section class="card auth-mvp">
      <a class="brand" href="./#/login"><img src="sahoo-examnexa-logo.png" alt="Sahoo ExamNexa" width="1448" height="1086"></a>
      <h1>Reset password</h1>
      <p id="recovery-status" role="status" aria-live="polite">Checking your recovery session…</p>
      <form id="recovery-update" hidden>
        <div class="field"><label for="new-password">New password</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" required></div>
        <div class="field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required></div>
        <p>Use at least 12 characters. Your account and role stay the same.</p>
        <button class="btn wide">Update password</button>
      </form>
      <p><a href="./#/forgot-password">Request a new recovery email</a></p>
      <a id="recovery-login" class="btn secondary" href="./#/login">Return to login</a>
    </section>
  </main>
</body>
</html>
